# Database for kempo-products-inventory's own test suite. Ports 5433-5440, 5442 and 5443 are taken
# by the other kempo repos' databases, so this one takes 5444.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kempo-products-inventory-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kempo
      POSTGRES_PASSWORD: kempo
      POSTGRES_DB: kempo_products_inventory_test
    ports:
      - "5444:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kempo"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_test_data:
